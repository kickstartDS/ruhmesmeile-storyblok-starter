# UI generation eval — campaign results (2.11).
#
# Publishes the results tree produced by `packages/agent-eval`: the per-trial
# Storybooks, the component screenshots and the index that ties them together.
# Exit criterion G4 — "a historical run is fully inspectable from a static URL"
# — is this file.
#
# Gated behind the shared JWT (D7), because the tree contains full agent
# transcripts. Same secret as the three MCP servers and the token editor, so
# there is one thing to rotate:
#
#   node scripts/issue-token.mjs --user alice --role admin --expires 90d
#   kamal env push -d agent-eval-results
#
# Deploying does not build the results — nothing can. Populate them first:
#
#   pnpm --filter agent-eval results:download   # if the campaign ran in CI
#   pnpm --filter agent-eval report build --all
#   pnpm --filter agent-eval report:index
#   pnpm --filter agent-eval calibration:export # the /calibrate queue
#   kamal deploy -d agent-eval-results
#
# The same container also serves `/calibrate` (3.6): the hand-grading queue,
# without the results tree it was derived from, so that people who do not have
# a checkout can grade. That is not a convenience — with one rater there is no
# way to tell a judge defect from one reviewer's idiosyncrasy, and the 80%
# target in 3.7 has no ceiling to be read against.

service: ruhmesmeile-agent-eval-results

image: <%= ENV["DOCKER_AGENT_EVAL_IMAGE_NAME"] %>

# Same server as every other service.
servers:
  web:
    - <%= ENV["HOSTING_SERVER_IP"] %>

proxy:
  ssl: true
  hosts:
    - <%= ENV["AGENT_EVAL_PUBLIC_DOMAIN"] %>
  app_port: 8080
  # A trial Storybook is a few megabytes of bundle; the default is tight for it.
  response_timeout: 60
  healthcheck:
    path: /health

registry:
  username: <%= ENV["DOCKER_USERNAME"] %>
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64
  # Repo root, so workspace config, patches and shared-auth are all in context.
  context: .
  dockerfile: packages/agent-eval/Dockerfile
  args:
    # Results change on every campaign and are copied in a late layer.
    CACHEBUST: <%= Time.now.to_i %>

# Hand-grading, written at runtime by people who are not holding the repository
# (3.6). The image carries the *questions* — `calibration/bundle.json`, built by
# `pnpm --filter agent-eval calibration:export` — and this volume carries the
# answers, which are the most expensive artefact the project produces and would
# otherwise last exactly until the next deploy.
#
# The volume is not a backup: it survives deploys and nothing else, and `pnpm
# judge` cannot read it. The answers belong in git next to the ones graded
# locally, so bring them home and commit them:
#
#   pnpm --filter agent-eval labels:pull
#
# That reads this volume over ssh and unions it into `calibration/labels/` by
# material hash — per label, not per file, because the same person grades in
# both places and copying either file over the other destroys a session. For
# someone without shell access to the host, the "download my labels" link on
# /calibrate produces the same file and `labels:pull --from <dir>` merges it.
volumes:
  - "ruhmesmeile-agent-eval-labels:/app/packages/agent-eval/calibration/labels"

env:
  clear:
    NODE_ENV: production
  secret:
    # Unset ⇒ the site is open. Set it before this is reachable from anywhere
    # that is not localhost. Every secret named here must also exist in
    # `.kamal/secrets`, so `MCP_REVOKED_TOKENS` is deliberately not listed:
    # revocation is opt-in, and naming a secret nobody has defined fails the
    # deploy rather than degrading.
    - MCP_JWT_SECRET
